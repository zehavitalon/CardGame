<svg viewBox="0 0 240 334" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Royal Diamond Lattice Pattern -->
    <pattern id="royalLattice" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 6,0 L 12,6 L 6,12 L 0,6 Z" fill="none" stroke="#d4af37" stroke-width="0.6" stroke-opacity="0.35"/>
      <circle cx="6" cy="6" r="1" fill="#f5d061" fill-opacity="0.7"/>
    </pattern>

    <!-- Symmetrical Corner Baroque Filigree -->
    <g id="cornerScroll">
      <path d="M 0,0 C 18,3 32,15 36,36 C 28,31 18,31 12,36 C 10,24 3,18 0,0 Z" fill="#d4af37" fill-opacity="0.9"/>
      <path d="M 0,0 C 10,2 18,10 20,20 C 15,17 10,17 6,20 C 5,14 2,10 0,0 Z" fill="#f5d061"/>
      <circle cx="20" cy="20" r="2.5" fill="#ffffff"/>
      <circle cx="32" cy="12" r="1.5" fill="#f5d061"/>
      <circle cx="12" cy="32" r="1.5" fill="#f5d061"/>
    </g>

    <!-- Edge Palmette Ornament -->
    <g id="edgePalmetteBlue">
      <path d="M 0,-18 C 10,-10 10,10 0,18 C -10,10 -10,-10 0,-18 Z" fill="#0f172a" stroke="#d4af37" stroke-width="1"/>
      <path d="M 0,-14 C 6,-7 6,7 0,14 C -6,7 -6,-7 0,-14 Z" fill="#f5d061" fill-opacity="0.85"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>

    <!-- Radial Petals for Central Medallion Halo -->
    <g id="petalRing">
      <circle cx="0" cy="-56" r="3" fill="#f5d061"/>
      <circle cx="0" cy="-53" r="1.5" fill="#ffffff"/>
    </g>
  </defs>

  <!-- 1. White Outer Card Margin (Classic Poker 4mm Margin) -->
  <rect x="0" y="0" width="240" height="334" rx="10" fill="#ffffff"/>

  <!-- 2. Inner Royal Midnight Blue Field -->
  <rect x="8" y="8" width="224" height="318" rx="6" fill="#0b1329"/>

  <!-- 3. Diamond Lattice Engraved Texture -->
  <rect x="8" y="8" width="224" height="318" rx="6" fill="url(#royalLattice)"/>

  <!-- 4. Concentric Gold Framing Lines -->
  <rect x="12" y="12" width="216" height="310" rx="5" fill="none" stroke="#d4af37" stroke-width="1.8"/>
  <rect x="15" y="15" width="210" height="304" rx="4" fill="none" stroke="#f5d061" stroke-width="0.8"/>
  <rect x="17" y="17" width="206" height="298" rx="3" fill="none" stroke="#0b1329" stroke-width="0.6"/>
  <rect x="19" y="19" width="202" height="294" rx="2.5" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- 5. Four Symmetrical Corner Baroque Filigrees -->
  <g transform="translate(20, 20)"><use href="#cornerScroll"/></g>
  <g transform="translate(220, 20) scale(-1, 1)"><use href="#cornerScroll"/></g>
  <g transform="translate(20, 314) scale(1, -1)"><use href="#cornerScroll"/></g>
  <g transform="translate(220, 314) scale(-1, -1)"><use href="#cornerScroll"/></g>

  <!-- 6. Symmetrical Side Palmettes -->
  <g transform="translate(120, 28)"><use href="#edgePalmetteBlue"/></g>
  <g transform="translate(120, 306)"><use href="#edgePalmetteBlue"/></g>
  <g transform="translate(28, 167) rotate(90)"><use href="#edgePalmetteBlue"/></g>
  <g transform="translate(212, 167) rotate(90)"><use href="#edgePalmetteBlue"/></g>

  <!-- 7. CENTRAL BAROQUE MEDALLION WITH CIRCULAR QR HOUSING -->
  <g transform="translate(120, 167)">
    <!-- Outer Filigree Sunburst Dots (24 radial points) -->
    <g transform="rotate(0)"><use href="#petalRing"/></g>
    <g transform="rotate(15)"><use href="#petalRing"/></g>
    <g transform="rotate(30)"><use href="#petalRing"/></g>
    <g transform="rotate(45)"><use href="#petalRing"/></g>
    <g transform="rotate(60)"><use href="#petalRing"/></g>
    <g transform="rotate(75)"><use href="#petalRing"/></g>
    <g transform="rotate(90)"><use href="#petalRing"/></g>
    <g transform="rotate(105)"><use href="#petalRing"/></g>
    <g transform="rotate(120)"><use href="#petalRing"/></g>
    <g transform="rotate(135)"><use href="#petalRing"/></g>
    <g transform="rotate(150)"><use href="#petalRing"/></g>
    <g transform="rotate(165)"><use href="#petalRing"/></g>
    <g transform="rotate(180)"><use href="#petalRing"/></g>
    <g transform="rotate(195)"><use href="#petalRing"/></g>
    <g transform="rotate(210)"><use href="#petalRing"/></g>
    <g transform="rotate(225)"><use href="#petalRing"/></g>
    <g transform="rotate(240)"><use href="#petalRing"/></g>
    <g transform="rotate(255)"><use href="#petalRing"/></g>
    <g transform="rotate(270)"><use href="#petalRing"/></g>
    <g transform="rotate(285)"><use href="#petalRing"/></g>
    <g transform="rotate(300)"><use href="#petalRing"/></g>
    <g transform="rotate(315)"><use href="#petalRing"/></g>
    <g transform="rotate(330)"><use href="#petalRing"/></g>
    <g transform="rotate(345)"><use href="#petalRing"/></g>

    <!-- Outer Gold Medallion Ring -->
    <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="#d4af37" stroke-width="2.5"/>
    
    <!-- Sculpted Gold Laurel / Rope Ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f5d061" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="47" fill="#0b1329" stroke="#996515" stroke-width="1"/>

    <!-- Inner Gold Beaded Border -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- WHITE CIRCULAR APERTURE HOUSING THE QR CODE -->
    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#d4af37" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="#ffffff" stroke="#f5d061" stroke-width="0.8"/>
  </g>
</svg>
