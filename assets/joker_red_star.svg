<svg viewBox="0 0 240 334" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vintage Card Margin Pattern -->
    <pattern id="cardPatternColor" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 L3 0 L6 3 L3 6 Z" fill="#f8fafc" stroke="#f59e0b" stroke-width="0.3" stroke-opacity="0.4"/>
    </pattern>
    <filter id="jokerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card White Body -->
  <rect x="2" y="2" width="236" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Inner Border Line Frame -->
  <rect x="14" y="14" width="212" height="306" rx="6" fill="url(#cardPatternColor)" stroke="#111827" stroke-width="1.8"/>
  <rect x="17" y="17" width="206" height="300" rx="4" fill="none" stroke="#111827" stroke-width="0.6"/>

  <!-- CORNER INDEXES: VERTICAL 'JOKER' -->
  <!-- Top Left: J O K E R -->
  <g transform="translate(24, 26)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">J</text>
    <text x="0" y="11" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">O</text>
    <text x="0" y="22" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">K</text>
    <text x="0" y="33" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">E</text>
    <text x="0" y="44" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">R</text>
  </g>

  <!-- Bottom Right: Inverted J O K E R -->
  <g transform="translate(216, 308) rotate(180)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">J</text>
    <text x="0" y="11" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">O</text>
    <text x="0" y="22" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">K</text>
    <text x="0" y="33" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">E</text>
    <text x="0" y="44" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">R</text>
  </g>

    <!-- TWO CORNER STARS (DIAGONAL: TOP-RIGHT AND BOTTOM-LEFT, CLEANLY INSIDE INNER FRAME) -->
  <g transform="translate(210, 30)">
    <path d="M 0,-8 L 2.4,-2.4 L 8.3,-1.6 L 4,2.7 L 5,8.7 L 0,5.9 L -5,8.7 L -4,2.7 L -8.3,-1.6 L -2.4,-2.4 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.8"/>
  </g>
  <g transform="translate(30, 304) rotate(180)">
    <path d="M 0,-8 L 2.4,-2.4 L 8.3,-1.6 L 4,2.7 L 5,8.7 L 0,5.9 L -5,8.7 L -4,2.7 L -8.3,-1.6 L -2.4,-2.4 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.8"/>
  </g>

  <!-- ==================== STANDING COURT JESTER ==================== -->
  <g id="jesterFigure" filter="url(#jokerShadow)" transform="translate(120, 167) scale(1.05)">

    <!-- 1. LEFT LEG (Viewer's left / Character's right) - BLACK TIGHTS -->
    <path d="M -16,36 L -10,75 L -14,105 L -7,107 L 2,82 L 2,36 Z" fill="#111827" stroke="#111827" stroke-width="1.2"/>

    <!-- 2. RIGHT LEG (Viewer's right / Character's left) - GOLD TIGHTS -->
    <path d="M 2,36 L 2,82 L 8,105 L 15,103 L 13,75 L 18,36 Z" fill="#f59e0b" stroke="#111827" stroke-width="1.2"/>

    <!-- Left Leg Knee Patch / Pattern -->
    <path d="M -15,70 Q -8,65 0,70 Q -8,75 -15,70 Z" fill="#dc2626" stroke="#111827" stroke-width="0.8"/>

    <!-- 3. SHOES (Pointy curled medieval boots with bells) -->
    <!-- Left Shoe (Red) -->
    <path d="M -14,105 Q -20,110 -30,108 Q -34,106 -36,101 Q -33,101 -27,105 L -7,107 Z" fill="#dc2626" stroke="#111827" stroke-width="1.2"/>
    <circle cx="-36" cy="101" r="3" fill="#fef08a" stroke="#111827" stroke-width="0.8"/>

    <!-- Right Shoe (Red) -->
    <path d="M 8,105 Q 18,110 32,108 Q 36,106 38,101 Q 34,101 26,105 L 15,103 Z" fill="#dc2626" stroke="#111827" stroke-width="1.2"/>
    <circle cx="38" cy="101" r="3" fill="#fef08a" stroke="#111827" stroke-width="0.8"/>

    <!-- 4. TUNIC / DOUBLET -->
    <!-- Torso (Red) -->
    <path d="M -22,-22 L 22,-22 L 20,24 L -20,24 Z" fill="#dc2626" stroke="#111827" stroke-width="1.2"/>
    <path d="M 0,-22 L 0,24" stroke="#111827" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Jagged Tunic Skirt (Black & Gold serrated hem) -->
    <polygon points="-24,20 -15,40 -6,22 4,40 14,22 24,38 24,18 -24,18" fill="#111827" stroke="#111827" stroke-width="1.2"/>
    <circle cx="-15" cy="40" r="2.5" fill="#fef08a" stroke="#111827" stroke-width="0.6"/>
    <circle cx="4" cy="40" r="2.5" fill="#fef08a" stroke="#111827" stroke-width="0.6"/>
    <circle cx="24" cy="38" r="2.5" fill="#fef08a" stroke="#111827" stroke-width="0.6"/>

    <!-- Belt (Gold with round buckle) -->
    <rect x="-21" y="14" width="42" height="7" fill="#f59e0b" stroke="#111827" stroke-width="1"/>
    <circle cx="0" cy="17.5" r="5" fill="#fef08a" stroke="#111827" stroke-width="1"/>
    <circle cx="0" cy="17.5" r="2" fill="#dc2626"/>

    <!-- 5. ARMS & HANDS -->
    <!-- Left Arm (Character's left / Viewer's right: Hand on hip) -->
    <path d="M 20,-20 Q 38,-6 28,12 L 20,10" fill="#dc2626" stroke="#111827" stroke-width="1.2"/>
    <circle cx="20" cy="-18" r="7" fill="#f59e0b" stroke="#111827" stroke-width="1"/>
    <!-- Glove on hip (White) -->
    <path d="M 20,6 C 24,4 32,8 26,16 C 20,20 18,12 20,6 Z" fill="#f8fafc" stroke="#111827" stroke-width="1.2"/>

    <!-- Right Arm (Character's right / Viewer's left: Holding Wand downwards) -->
    <path d="M -20,-20 Q -38,-10 -30,16 L -24,14" fill="#dc2626" stroke="#111827" stroke-width="1.2"/>
    <circle cx="-20" cy="-18" r="7" fill="#111827" stroke="#111827" stroke-width="1"/>
    <!-- Glove holding wand (White) -->
    <ellipse cx="-28" cy="18" rx="6" ry="6" fill="#f8fafc" stroke="#111827" stroke-width="1.2"/>

    <!-- Golden Wand / Scepter -->
    <line x1="-28" y1="12" x2="-26" y2="58" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="-28" cy="10" r="3" fill="#fef08a" stroke="#111827" stroke-width="0.8"/>
    
    <!-- Rose / Marotte flower pointing downward -->
    <g transform="translate(-26, 62)">
      <path d="M 0,-4 C -6,-1 -8,6 -4,12 C 0,16 6,14 6,8 C 6,0 2,-4 0,-4 Z" fill="#e11d48" stroke="#111827" stroke-width="1"/>
      <path d="M -1,2 C -3,5 -2,9 1,11" stroke="#fef08a" stroke-width="0.8" fill="none"/>
      <!-- Small green/dark sepals -->
      <polygon points="-3,-5 0,-1 3,-5 0,-2" fill="#f59e0b"/>
    </g>

    <!-- 6. COLLAR (Broad ruffled serrated points radiating around neck) -->
    <polygon points="-28,-24 -18,-10 -8,-26 0,-8 8,-26 18,-10 28,-24 16,-34 -16,-34" fill="#111827" stroke="#111827" stroke-width="1.2"/>
    <polygon points="-22,-24 -14,-14 -6,-24 0,-12 6,-24 14,-14 22,-24 12,-30 -12,-30" fill="#f59e0b" stroke="#111827" stroke-width="1"/>
    <!-- Collar bells -->
    <circle cx="-18" cy="-10" r="2.5" fill="#fef08a" stroke="#111827" stroke-width="0.6"/>
    <circle cx="0" cy="-8" r="2.5" fill="#fef08a" stroke="#111827" stroke-width="0.6"/>
    <circle cx="18" cy="-10" r="2.5" fill="#fef08a" stroke="#111827" stroke-width="0.6"/>

    <!-- 7. HEAD & FACE -->
    <!-- Chin & Neck -->
    <path d="M -10,-32 Q 0,-20 10,-32 L 8,-44 L -8,-44 Z" fill="#ffedd5" stroke="#111827" stroke-width="1.2"/>
    <!-- Head Oval -->
    <ellipse cx="0" cy="-44" rx="13" ry="15" fill="#ffedd5" stroke="#111827" stroke-width="1.2"/>

    <!-- Face Details (Eyes, Nose, Merry Jester Grin) -->
    <!-- Eyes -->
    <ellipse cx="-4" cy="-47" rx="1.8" ry="2.2" fill="#111827"/>
    <ellipse cx="5" cy="-47" rx="1.8" ry="2.2" fill="#111827"/>
    <!-- Arched Eyebrows -->
    <path d="M -8,-51 Q -4,-54 -1,-51" fill="none" stroke="#111827" stroke-width="1"/>
    <path d="M 2,-51 Q 5,-54 9,-51" fill="none" stroke="#111827" stroke-width="1"/>
    <!-- Nose -->
    <path d="M 0,-46 L 2,-42 L -1,-42" fill="none" stroke="#111827" stroke-width="1"/>
    <!-- Wide Grin with Dimples -->
    <path d="M -7,-39 Q 0,-33 7,-39" fill="none" stroke="#991b1b" stroke-width="1.6"/>
    <path d="M -8,-41 L -6,-39" stroke="#111827" stroke-width="1"/>
    <path d="M 8,-41 L 6,-39" stroke="#111827" stroke-width="1"/>
    <!-- Red cheeks -->
    <circle cx="-7" cy="-43" r="2.5" fill="#dc2626" opacity="0.35"/>
    <circle cx="7" cy="-43" r="2.5" fill="#dc2626" opacity="0.35"/>

    <!-- 8. THREE-HORNED JESTER HAT (CAP 'N' BELLS) -->
    <!-- Hat Crown Band -->
    <path d="M -13,-54 Q 0,-50 13,-54 Q 0,-58 -13,-54 Z" fill="#f59e0b" stroke="#111827" stroke-width="1.2"/>

    <!-- Center Horn (Tall pointing upwards and curling left) -->
    <path d="M -7,-54 Q -4,-82 2,-92 Q 8,-84 4,-54 Z" fill="#dc2626" stroke="#111827" stroke-width="1.2"/>
    <circle cx="2" cy="-92" r="3.5" fill="#fef08a" stroke="#111827" stroke-width="0.8"/>

    <!-- Left Horn (Curving downwards to left) -->
    <path d="M -12,-54 C -26,-66 -36,-56 -38,-42 C -35,-42 -30,-48 -7,-54 Z" fill="#111827" stroke="#111827" stroke-width="1.2"/>
    <circle cx="-38" cy="-42" r="3.5" fill="#fef08a" stroke="#111827" stroke-width="0.8"/>

    <!-- Right Horn (Curving downwards to right) -->
    <path d="M 12,-54 C 26,-66 36,-56 38,-42 C 35,-42 30,-48 7,-54 Z" fill="#dc2626" stroke="#111827" stroke-width="1.2"/>
    <circle cx="38" cy="-42" r="3.5" fill="#fef08a" stroke="#111827" stroke-width="0.8"/>

    <!-- Center Hat Diamond Emblem -->
    <polygon points="0,-64 4,-58 0,-52 -4,-58" fill="#f59e0b" stroke="#111827" stroke-width="0.8"/>
  </g>

</svg>
